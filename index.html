<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Stars ⭐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <h1>⭐ Catch the Stars</h1>
            <div class="stats">
                <span>Score: <b id="score">0</b></span>
                <span>Lives: <b id="lives">3</b></span>
            </div>
        </div>

        <div id="game">
            <div id="basket">🧺</div>

            <div id="start-screen">
                <h2>Catch the Stars!</h2>
                <p>Use ← → or A / D to move</p>
                <button id="start-btn">START GAME</button>
            </div>

            <div id="game-over" class="hidden">
                <h2>Game Over 😭</h2>
                <p>Your score: <strong id="final-score">0</strong></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>

        <p class="controls">← → Move &nbsp; | &nbsp; A / D Move</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
